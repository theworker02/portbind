<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>portbind 1.00</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap brand">
      <img src="logo.svg" alt="portbind mark">
      <div>
        <h1>portbind</h1>
        <p class="tag">Bind-all and PORT scanner · version 1.00</p>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <h2>Purpose</h2>
      <p>Scan files for 0.0.0.0 and PORT or $PORT. Exit 0 only when both patterns are present.</p>
      <h2>Install</h2>
      <pre><code>npm install -g portbind</code></pre>
      <h2>Usage</h2>
      <pre><code>portbind [files-or-dirs]</code></pre>
    </section>
    <footer>MIT © 2026 theworker02 · version 1.00 (1.0.0) · navy #0B1F33 · gold #C9A227</footer>
  </main>
